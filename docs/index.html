<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saheer Khan S — Portfolio</title>
<meta name="description" content="Portfolio of Saheer Khan S, a B.Tech AI & ML student from Kerala, India: projects, skills, certifications and what I'm working on now.">
<style>
  :root {
    --bg: #f5f2ea;
    --surface: #fffdf8;
    --ink: #1b1f1a;
    --muted: #5d645b;
    --line: #dcd7c9;
    --accent: #1d6a48;
    --accent-soft: #dcebe1;
    --on-accent: #ffffff;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111411; --surface: #191d19; --ink: #e9e6dd; --muted: #a0a79c;
      --line: #2c322c; --accent: #74d19c; --accent-soft: #1d2f25; --on-accent: #0f1410;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111411; --surface: #191d19; --ink: #e9e6dd; --muted: #a0a79c;
    --line: #2c322c; --accent: #74d19c; --accent-soft: #1d2f25; --on-accent: #0f1410;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 20px; height: 56px; }
  .brand { font-family: var(--serif); font-size: 19px; font-weight: 600; text-decoration: none; margin-right: auto; }
  nav { display: flex; gap: 20px; }
  nav a { font: 13px var(--mono); color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  #theme {
    font: 13px var(--mono); color: var(--muted); background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  }
  #theme:hover { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 720px) { nav { display: none; } }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1.5fr 1fr; gap: 48px; align-items: end; padding: 88px 0 72px; }
  .eyebrow { font: 13px var(--mono); color: var(--accent); letter-spacing: .04em; margin: 0 0 20px; }
  h1 { font: 600 clamp(44px, 8vw, 84px)/1 var(--serif); letter-spacing: -.02em; margin: 0 0 24px; text-wrap: balance; }
  .lede { font-size: 20px; color: var(--muted); max-width: 34em; margin: 0 0 32px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 11px 20px; border-radius: 8px; border: 1px solid var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:hover { transform: translateY(-1px); }
  .now {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
  }
  .now h2 { font: 13px var(--mono); color: var(--accent); margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .now ul { margin: 0; padding: 0; list-style: none; }
  .now li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15.5px; }
  .now li:first-child { border-top: 0; padding-top: 0; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; padding: 56px 0 48px; } }

  /* Sections */
  section { padding: 64px 0; border-top: 1px solid var(--line); }
  .head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; }
  .num { font: 13px var(--mono); color: var(--accent); }
  h2.title { font: 600 clamp(28px, 4vw, 38px)/1.1 var(--serif); margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); max-width: 40em; margin: -16px 0 32px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
    display: flex; flex-direction: column;
  }
  .card h3 { font: 600 21px/1.25 var(--serif); margin: 0 0 8px; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 15.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .tags li { font: 12px var(--mono); background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 999px; }
  .card .link { margin-top: auto; font: 13px var(--mono); color: var(--accent); text-decoration: none; }
  .card .link:hover { text-decoration: underline; }
  .card.feature { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 720px) { .card.feature { grid-template-columns: 1fr; } }

  /* Playable demo */
  .demo { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 18px; font: 14px/1.6 var(--mono); }
  .demo output { display: block; min-height: 4.8em; white-space: pre-wrap; margin-bottom: 12px; }
  .demo form { display: flex; gap: 8px; }
  .demo input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .demo button {
    font: inherit; cursor: pointer; background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 6px; padding: 8px 14px;
  }

  /* Skills */
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; }
  .skills h3 { font: 13px var(--mono); color: var(--muted); margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .skills ul { margin: 0; padding: 0; list-style: none; }
  .skills li { padding: 7px 0; }
  .skills small { display: block; color: var(--muted); font-size: 14px; }

  /* Certifications + journey rows */
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 18px 0; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; }
  .rows .when { font: 13px var(--mono); color: var(--muted); padding-top: 4px; }
  .rows strong { font: 600 19px var(--serif); display: block; }
  .rows span { color: var(--muted); font-size: 15.5px; }
  .rows a { color: var(--accent); }
  @media (max-width: 560px) { .rows li { grid-template-columns: 1fr; gap: 2px; } }

  /* Contact */
  .contact { text-align: center; padding: 88px 0; }
  .contact h2 { font: 600 clamp(32px, 6vw, 56px)/1.05 var(--serif); margin: 0 0 16px; letter-spacing: -.02em; }
  .contact p { color: var(--muted); max-width: 32em; margin: 0 auto 28px; }
  .contact .actions { justify-content: center; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; font: 13px var(--mono); color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Sections">
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#certifications" data-nav="certifications">Certifications</a>
      <a href="#journey">Journey</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="theme" type="button" aria-label="Switch colour theme">theme</button>
  </div>
</header>

<main id="top" class="wrap">
  <div class="hero">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="name"></h1>
      <p class="lede" id="lede"></p>
      <div class="actions" id="heroActions"></div>
    </div>
    <aside class="now" aria-labelledby="nowTitle">
      <h2 id="nowTitle"><span class="dot"></span>What I'm doing now</h2>
      <ul id="now"></ul>
    </aside>
  </div>

  <section id="projects">
    <div class="head"><span class="num">01</span><h2 class="title">Projects</h2></div>
    <div class="grid" id="projectGrid"></div>
  </section>

  <section id="skills">
    <div class="head"><span class="num">02</span><h2 class="title">Skills</h2></div>
    <p class="sub">Sorted by how well I actually know them, not by how good they look on a list.</p>
    <div class="skills" id="skillGroups"></div>
  </section>

  <section id="certifications">
    <div class="head"><span class="num">03</span><h2 class="title">Certifications</h2></div>
    <ul class="rows" id="certList"></ul>
  </section>

  <section id="journey">
    <div class="head"><span class="num">04</span><h2 class="title">Journey</h2></div>
    <ul class="rows" id="journeyList"></ul>
  </section>

  <section id="contact" class="contact">
    <h2>Let's talk.</h2>
    <p id="contactText"></p>
    <div class="actions" id="contactActions"></div>
  </section>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE.
   Everything on the page is generated from this one object, so
   adding a project or certificate is just adding an entry below.
   ============================================================ */
const PROFILE = {
  name: "Saheer Khan S",
  eyebrow: "B.Tech AI & ML student · Kerala, India",
  lede: "I'm learning to build things with Python, one small program at a time, on the way to machine learning and web development.",
  github: "https://github.com/saheerkhan-dev",
  email: "",        // e.g. "you@example.com" — adds an email button
  linkedin: "",     // e.g. "https://www.linkedin.com/in/your-id"
  resume: "",       // e.g. "resume.pdf" (put the file next to this page)

  now: [
    "Working through Python fundamentals, currently on functions",
    "Starting web development (HTML, CSS, JavaScript)",
    "Studying for my B.Tech in Artificial Intelligence & Machine Learning",
    "Preparing for internships"
  ],

  projects: [
    {
      title: "Number Guessing Game",
      text: "The computer picks a number between 1 and 100 and tells you whether each guess is too high or too low, counting your attempts until you get it. Written in Python; the version on this page is the same logic in JavaScript, so you can play it here.",
      tags: ["Python", "random", "while loops"],
      link: "https://github.com/saheerkhan-dev/python-practice/blob/main/mini-projects/number_guessing_game.py",
      demo: "guess"   // shows the playable game on the card
    },
    {
      title: "Simple Calculator",
      text: "A menu-driven command-line calculator: enter two numbers, pick an operation, get the result. Handles invalid menu choices.",
      tags: ["Python", "if / elif", "user input"],
      link: "https://github.com/saheerkhan-dev/python-practice/blob/main/mini-projects/simple_calculator.py"
    },
    {
      title: "Grade Classifier",
      text: "Turns a mark into a result band (Fail, Pass, First Class or Distinction) using chained conditions.",
      tags: ["Python", "conditions"],
      link: "https://github.com/saheerkhan-dev/python-practice/blob/main/conditions/grade_classification.py"
    },
    {
      title: "Python Practice",
      text: "My public learning log: 25 small programs covering basics, conditions and loops, committed one at a time as I learn each idea.",
      tags: ["Python", "Git", "GitHub"],
      link: "https://github.com/saheerkhan-dev/python-practice"
    }
  ],

  skills: [
    { group: "Comfortable with", items: [
      { name: "Python basics", note: "variables, input and output, type conversion" },
      { name: "Conditions", note: "if / elif / else, comparisons" },
      { name: "Loops", note: "for, while, range, break" },
      { name: "Git & GitHub", note: "commits, repositories, READMEs" }
    ]},
    { group: "Learning now", items: [
      { name: "Python functions" },
      { name: "HTML, CSS & JavaScript" }
    ]},
    { group: "Up next", items: [
      { name: "Data structures in Python" },
      { name: "NumPy & pandas" },
      { name: "Machine learning foundations" }
    ]}
  ],

  // Add certificates like this (the section stays hidden while the list is empty):
  // { when: "2026", title: "Certificate name", issuer: "Issuing organisation", link: "https://link-to-credential" }
  certifications: [],

  journey: [
    { when: "Now", title: "B.Tech in Artificial Intelligence & Machine Learning", text: "Undergraduate student in Kerala, India." },
    { when: "Apr 2026", title: "Started coding in public", text: "Opened my Python practice repository on GitHub and began committing every program I write." }
  ],

  contactText: "I'm looking for internships and happy to hear about beginner-friendly projects to contribute to."
};

/* ---------- rendering (no need to edit below) ---------- */
const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => k && n.append(k));
  return n;
};
const ext = (text, href, cls) => el("a", { textContent: text, href, className: cls || "", target: "_blank", rel: "noopener" });

document.title = PROFILE.name + " — Portfolio";
$("brand").textContent = PROFILE.name;
$("eyebrow").textContent = PROFILE.eyebrow;
$("name").textContent = PROFILE.name;
$("lede").textContent = PROFILE.lede;
$("contactText").textContent = PROFILE.contactText;
$("footer").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

$("heroActions").append(
  el("a", { textContent: "See my projects", href: "#projects", className: "btn primary" }),
  ext("GitHub", PROFILE.github, "btn")
);
if (PROFILE.resume) $("heroActions").append(ext("Résumé", PROFILE.resume, "btn"));

PROFILE.now.forEach(t => $("now").append(el("li", { textContent: t })));

PROFILE.projects.forEach(p => {
  const body = el("div", {}, [
    el("h3", { textContent: p.title }),
    el("p", { textContent: p.text }),
    el("ul", { className: "tags" }, p.tags.map(t => el("li", { textContent: t }))),
    p.link && ext("View code →", p.link, "link")
  ]);
  if (p.demo === "guess") {
    body.style.cssText = "display:flex;flex-direction:column";
    $("projectGrid").append(el("article", { className: "card feature" }, [body, guessDemo()]));
  } else {
    const card = el("article", { className: "card" });
    card.append(...body.childNodes);
    $("projectGrid").append(card);
  }
});

PROFILE.skills.forEach(g => {
  $("skillGroups").append(el("div", {}, [
    el("h3", { textContent: g.group }),
    el("ul", {}, g.items.map(s => el("li", { textContent: s.name }, [s.note && el("small", { textContent: s.note })])))
  ]));
});

const row = (when, title, text, link) => el("li", {}, [
  el("div", { className: "when", textContent: when }),
  el("div", {}, [
    el("strong", { textContent: title }),
    el("span", { textContent: text || "" }),
    link && el("span", {}, [" · ", ext("View credential", link)])
  ])
]);
if (PROFILE.certifications.length) {
  PROFILE.certifications.forEach(c => $("certList").append(row(c.when, c.title, c.issuer, c.link)));
} else {
  $("certifications").hidden = true;
  document.querySelector('[data-nav="certifications"]').hidden = true;
  $("journey").querySelector(".num").textContent = "03";
}
PROFILE.journey.forEach(j => $("journeyList").append(row(j.when, j.title, j.text)));

if (PROFILE.email) $("contactActions").append(el("a", { textContent: "Email me", href: "mailto:" + PROFILE.email, className: "btn primary" }));
$("contactActions").append(ext("GitHub", PROFILE.github, PROFILE.email ? "btn" : "btn primary"));
if (PROFILE.linkedin) $("contactActions").append(ext("LinkedIn", PROFILE.linkedin, "btn"));

/* Playable port of mini-projects/number_guessing_game.py */
function guessDemo() {
  let secret, attempts;
  const out = el("output", { ariaLive: "polite" });
  const input = el("input", { type: "number", min: 1, max: 100, placeholder: "1 to 100", ariaLabel: "Your guess", required: true });
  const button = el("button", { textContent: "Guess" });
  const start = () => {
    secret = Math.floor(Math.random() * 100) + 1; attempts = 0;
    out.textContent = "I'm thinking of a number\nbetween 1 and 100.";
    button.textContent = "Guess";
  };
  const form = el("form", {}, [input, button]);
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (button.textContent === "Play again") { start(); input.value = ""; input.focus(); return; }
    const g = Number(input.value); attempts++;
    if (g < secret) out.textContent = g + " is too low. Try again.";
    else if (g > secret) out.textContent = g + " is too high. Try again.";
    else {
      out.textContent = "You got it! The number was " + secret + ".\nIt took you " + attempts + (attempts === 1 ? " attempt." : " attempts.");
      button.textContent = "Play again";
    }
    input.select();
  });
  start();
  return el("div", { className: "demo" }, [out, form]);
}

/* Theme toggle: follows the system until you choose */
const root = document.documentElement;
try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch (e) {}
$("theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
